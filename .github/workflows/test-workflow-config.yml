name: go-test

on:
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:
    branches: [ '**' ]

jobs:
  full_ci:
    strategy:
      matrix:
        go_version: [ 1.20.x ]

    runs-on: ubuntu-20.04

    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go_version }}
          
      - name: Run tests
        run:  go test -v -coverprofile=coverage.out ./...
      
      - name: find total test coverage 
        run:  go tool cover -func=coverage.out | grep total | awk '{print $3}' > coverage.txt

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: coverage.txt
